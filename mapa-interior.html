<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Meu Mapa Interior</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita e respirada, uma pergunta por tela; flor de pétalas como progresso e como resultado */
:root{
  --bg:#FBF3F5; --surface:#FFFFFF; --ink:#33202A; --muted:#7A6670; --line:#EAD9E0;
  --rose:#72243E; --rose-soft:#F5DCE5; --on-rose:#FFF7FA;
  --lav:#7E70C2; --lav-soft:#E9E4F7;
  --sage:#6F9180; --sage-soft:#DCE8E1;
  --gold:#B08A44; --gold-soft:#F3E8CF;
  --crit:#C62F2F; --crit-soft:#FCE6E4;
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1115; --surface:#251A20; --ink:#F5E8EE; --muted:#B49DA8; --line:#3B2A33;
  --rose:#E99BB7; --rose-soft:#46222F; --on-rose:#2A0F1A;
  --lav:#ADA2E8; --lav-soft:#2D2842; --sage:#9DBDAB; --sage-soft:#20302A;
  --gold:#DDBB73; --gold-soft:#3A3020; --crit:#FF7B72; --crit-soft:#4A1F1F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1A1115; --surface:#251A20; --ink:#F5E8EE; --muted:#B49DA8; --line:#3B2A33;
  --rose:#E99BB7; --rose-soft:#46222F; --on-rose:#2A0F1A;
  --lav:#ADA2E8; --lav-soft:#2D2842; --sage:#9DBDAB; --sage-soft:#20302A;
  --gold:#DDBB73; --gold-soft:#3A3020; --crit:#FF7B72; --crit-soft:#4A1F1F; color-scheme:dark }

html,body{height:100%}
body{
  background:
    radial-gradient(70% 45% at 10% -5%, var(--rose-soft), transparent 70%),
    radial-gradient(60% 40% at 105% 105%, var(--lav-soft), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink); font:400 16px/1.55 var(--body);
}
.app{min-height:100%; max-width:580px; margin:0 auto; display:flex; flex-direction:column;
  padding-block:14px 40px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); box-sizing:border-box}
.app.wide{max-width:860px}

/* barra superior */
.top{display:flex; align-items:center; gap:12px; min-height:48px}
.top .back{background:none; border:0; color:var(--muted); font:500 14px var(--body); padding:8px 4px; cursor:pointer; border-radius:8px}
.top .back:hover{color:var(--ink)}
.prog{display:flex; align-items:center; gap:10px; margin-left:auto; margin-right:auto}
.prog svg{width:38px; height:38px}
.prog-txt{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.prog-txt b{color:var(--ink); font-weight:600}
.snd{background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 12px; font:500 12px var(--body); cursor:pointer}
.tag{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold-soft); border-radius:999px; padding:3px 8px}

/* palco */
.stage{flex:1; display:flex; flex-direction:column; padding-top:24px}
.stage.in{animation:rise .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--rose); font-weight:600; margin:0 0 10px}
.qt{font:350 31px/1.15 var(--display); font-variation-settings:"opsz" 96; letter-spacing:-.01em; margin:0 0 10px; text-wrap:balance}
.qs{color:var(--muted); margin:0 0 22px; font-size:15px}
.qs2{color:var(--ink); font-weight:500; margin:26px 0 14px; font-size:15px}

.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:17px 20px; border-radius:22px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font:500 16px/1.35 var(--body); cursor:pointer;
  transition:border-color .25s, background .25s, transform .15s; position:relative}
.opt:hover{border-color:color-mix(in srgb, var(--rose) 40%, var(--line))}
.opt:active{transform:scale(.985)}
.opt .dot{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted); flex:none; transition:.25s; box-sizing:border-box}
.opt.multi .dot{border-radius:7px}
.opt.sel{border-color:var(--rose); background:var(--rose-soft)}
.opt.sel .dot{background:var(--rose); border-color:var(--rose); box-shadow:inset 0 0 0 4px var(--rose-soft)}
.opt.sel::after{content:""; position:absolute; inset:-1.5px; border-radius:22px; pointer-events:none; animation:bloom .7s ease-out}
@keyframes bloom{from{box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 45%, transparent)}to{box-shadow:0 0 0 14px transparent}}
.opt.compact{padding:13px 18px}
.opt[disabled]{opacity:.45; cursor:not-allowed}

.field{width:100%; box-sizing:border-box; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:20px; padding:16px 18px; font:400 17px/1.5 var(--body); resize:vertical}
.field:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 4px var(--rose-soft)}
.age{font:350 64px/1 var(--display); text-align:center; max-width:220px; margin:0 auto; display:block; padding:14px}
.age::-webkit-inner-spin-button{opacity:0}

/* escala 0-10 */
.scale{padding:6px 0}
.scale-val{display:block; text-align:center; font:300 76px/1 var(--display); font-variation-settings:"opsz" 144; transition:color .3s; font-variant-numeric:tabular-nums}
.scale-word{text-align:center; color:var(--muted); font-size:14px; min-height:21px; margin:2px 0 18px}
.range{-webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; cursor:pointer; margin:0}
.range::-webkit-slider-runnable-track{height:10px; border-radius:99px; background:linear-gradient(90deg, var(--sage), var(--gold) 50%, var(--rose)); opacity:.9}
.range::-moz-range-track{height:10px; border-radius:99px; background:linear-gradient(90deg, var(--sage), var(--gold) 50%, var(--rose))}
.range::-webkit-slider-thumb{-webkit-appearance:none; width:34px; height:34px; margin-top:-12px; border-radius:50%; background:var(--surface); border:3px solid var(--ink); box-shadow:0 0 0 7px color-mix(in srgb, var(--surface) 70%, transparent), 0 6px 18px rgba(0,0,0,.18)}
.range::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:var(--surface); border:3px solid var(--ink)}
.range:focus-visible{outline:2px solid var(--rose); outline-offset:6px; border-radius:12px}
.ticks{display:flex; justify-content:space-between; padding:0 12px; margin-top:2px}
.ticks span{font-size:11px; color:var(--muted); width:12px; text-align:center; font-variant-numeric:tabular-nums}
.ends{display:flex; justify-content:space-between; gap:20px; margin-top:10px; font-size:13px; color:var(--muted)}
.ends span:last-child{text-align:right}
.reveal{animation:rise .45s ease-out}
.mini .scale-val{font-size:44px}.mini .scale-word,.mini .ticks{display:none}.mini .range{height:36px}

.actions{margin-top:auto; padding-top:30px; display:flex; flex-direction:column; align-items:center; gap:12px}
.btn{border:0; background:var(--rose); color:var(--on-rose); border-radius:999px; padding:16px 34px; font:600 16px var(--body); cursor:pointer; min-width:220px; transition:transform .15s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.btn:not([disabled]).breathe{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--rose) 30%, transparent)}50%{box-shadow:0 0 0 10px transparent}}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.link{background:none; border:0; color:var(--muted); font:500 14px var(--body); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--rose); outline-offset:3px}

/* boas-vindas */
.hero{text-align:center; padding-top:10px}
.hero svg{width:150px; height:150px; margin:0 auto 18px; display:block}
.hero h1{font:300 46px/1.02 var(--display); font-variation-settings:"opsz" 144; letter-spacing:-.02em; margin:0 0 14px}
.hero h1 em{font-style:italic; color:var(--rose)}
.hero p{color:var(--muted); max-width:42ch; margin:0 auto 10px}
.meta{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:22px 0 0}
.meta span{font-size:13px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; color:var(--muted)}
.slow-petal{transform-origin:75px 75px; animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* consentimento */
.consent{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px 22px 8px}
.consent dl{margin:0; display:grid; gap:14px}
.consent dt{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--rose); font-weight:600}
.consent dd{margin:2px 0 0; font-size:15px}
.check{display:flex; gap:12px; align-items:flex-start; margin-top:20px; cursor:pointer; font-size:15px}
.check input{width:22px; height:22px; accent-color:var(--rose); flex:none; margin-top:1px}

/* transição de bloco */
.intro{text-align:center; justify-content:center}
.intro .ring{width:120px; height:120px; margin:0 auto 26px; position:relative}
.intro .ring::before{content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle, var(--gold-soft), transparent 70%); animation:inhale 5s ease-in-out infinite}
.intro .ring svg{position:relative; width:120px; height:120px}
@keyframes inhale{0%,100%{transform:scale(.8); opacity:.6}50%{transform:scale(1.25); opacity:1}}
.intro h2{font:300 36px/1.1 var(--display); letter-spacing:-.01em; margin:0 auto 14px; max-width:16ch; text-wrap:balance}
.intro p{color:var(--muted); max-width:40ch; margin:0 auto}
.intro .breath{font-size:13px; color:var(--gold); margin-top:22px; letter-spacing:.04em}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 20px); opacity:0; background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:999px; font:italic 400 16px var(--display); pointer-events:none; transition:.45s; z-index:20; max-width:calc(100% - 40px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* resultado */
.result{text-align:center}
.mapwrap{position:relative; max-width:400px; margin:0 auto}
.mapwrap svg{width:100%; height:auto; display:block; overflow:visible}
.ready{font:300 36px/1.1 var(--display); letter-spacing:-.01em; margin:4px 0 10px; opacity:0; transition:opacity 1.2s}
.ready.on{opacity:1}
.result .lead{color:var(--muted); max-width:44ch; margin:0 auto 28px}
.areas{display:grid; gap:12px; text-align:left}
.area{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px 18px}
.area svg{width:28px; height:28px; margin-top:2px}
.area h3{font:500 19px/1.2 var(--display); margin:0 0 4px}
.area p{margin:0; color:var(--muted); font-size:15px}
.sec-h{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:34px 0 12px; text-align:left}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--gold-soft); color:var(--ink); border-radius:999px; padding:7px 14px; font-size:14px}
.next{background:var(--rose-soft); border-radius:22px; padding:20px 22px; text-align:left; margin-top:28px}
.next p{margin:0}
.next .q{font:italic 400 19px/1.4 var(--display); margin-bottom:8px}
.legend{display:flex; justify-content:center; gap:16px; font-size:12px; color:var(--muted); margin:6px 0 18px; flex-wrap:wrap}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px}

/* relatório */
.report{text-align:left}
.rep-head{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:8px}
.rep-head h1{font:400 30px/1.15 var(--display); margin:4px 0 6px}
.rep-head .sub{color:var(--muted); font-size:14px}
.rep-meta{display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:12px; font-size:14px}
.rep-meta input{border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); font:500 14px var(--body); width:110px; padding:2px}
.report h2{font:500 20px/1.2 var(--display); margin:30px 0 10px; display:flex; gap:10px; align-items:baseline}
.report h2 small{font:600 11px var(--body); letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.report p{margin:0 0 8px}
.note{font-size:13px; color:var(--muted)}
.flags{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.flags li{border-left:4px solid var(--rose); background:var(--surface); padding:11px 14px; border-radius:0 12px 12px 0; font-size:15px}
.flags li.warn{border-color:var(--gold)}
.flags li.info{border-color:var(--lav)}
.flags li.ok{border-color:var(--sage)}
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
tr.crit td{color:var(--crit); background:var(--crit-soft); font-weight:600}
tr.crit td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.critdot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--crit); margin-right:6px; vertical-align:1px}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
.pill{display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:3px 10px; white-space:nowrap}
.p0{background:var(--sage-soft); color:var(--ink)} .p1{background:var(--gold-soft); color:var(--ink)} .p2{background:var(--rose-soft); color:var(--rose)} .pn{background:var(--line); color:var(--muted)}
.bar{height:6px; border-radius:9px; background:var(--line); width:90px; display:inline-block; vertical-align:middle; margin-right:8px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:9px}
.quote{font:italic 400 19px/1.45 var(--display); border-left:3px solid var(--gold); padding:4px 0 4px 16px; margin:6px 0 12px}
.refs{display:grid; gap:10px}
.ref{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
.ref b{display:block; margin-bottom:4px}
.ref ul{margin:0; padding-left:18px; font-size:14px; color:var(--muted)}
.disc{margin-top:30px; padding:16px; border-radius:14px; background:var(--lav-soft); font-size:13px}
.rep-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:24px}
.rep-actions .btn{min-width:0}
.copybox{width:100%; height:200px; margin-top:12px; font:12px/1.5 ui-monospace, monospace}

@media (max-width:420px){ th,td{padding:9px 8px} .bar{width:52px} .report table{font-size:13px} .qt{font-size:27px} .hero h1{font-size:40px} .scale-val{font-size:66px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>

</head>
<body>
<div class="app" id="app">
  <div class="top" id="top"></div>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- conteúdo ---------- */
const FREQ=['Nunca','Raramente','Às vezes','Frequentemente','Quase sempre'];
const SEXF=['Nunca','Às vezes','Frequentemente','Sempre','Prefiro não responder'];
const BLOCKS=[
 {n:1,name:'Contexto',title:'Primeiro, um pouco sobre o seu momento.',sub:'Sem pressa. Aqui não existem respostas certas ou erradas.'},
 {n:2,name:'Corpo',title:'Agora, o que o seu corpo tem dito.',sub:'Para cada sinal, conte com que frequência aparece e o quanto pesa no seu dia.'},
 {n:3,name:'Intimidade',title:'Um espaço só seu.',sub:'Quase ninguém pergunta sobre isso, e por isso importa tanto. É confidencial, e você pode pular qualquer pergunta.'},
 {n:4,name:'Por dentro',title:'Como você tem se sentido por dentro.',sub:'Emoções, memória, clareza. E como você se vê hoje.'},
 {n:5,name:'Rotina',title:'Sua rotina, do jeito que ela é hoje.',sub:'Não do jeito que deveria ser. Do jeito que é.'},
 {n:6,name:'Movimento',title:'Agora, a segurança do seu movimento.',sub:'Com estas respostas, a equipe sabe se o programa de fortalecimento é seguro para você agora. Responda com calma e sem deixar nada de fora.'},
 {n:7,name:'Desejos',title:'Por último, o que você quer de volta.',sub:'É daqui que o seu caminho começa.'}
];
const yes=a=>a==0||a==1, no=a=>a==2;
const Q=[
 {id:'1',b:1,t:'number',q:'Qual a sua idade?',s:'Em anos.'},
 {id:'2',b:1,t:'single',q:'Como está a sua menstruação hoje?',o:['Ainda menstruo, mesmo que irregular','Estou sem menstruar há 3 a 12 meses','Não menstruo mais há mais de 1 ano','Parei de menstruar por cirurgia, DIU ou uso de hormônio','Não sei dizer']},
 {id:'2b',b:1,t:'single',c:A=>A['2']===2,q:'Há quanto tempo você não menstrua?',o:['1 a 2 anos','2 a 5 anos','5 a 10 anos','Mais de 10 anos']},
 {id:'3',b:1,t:'multi',q:'Você já passou por alguma destas situações?',s:'Pode marcar mais de uma.',o:['Histerectomia (retirada do útero)','Retirada de um ou ambos os ovários','Câncer de mama','Trombose ou embolia','Nenhuma das anteriores'],excl:4},
 {id:'3b',b:1,t:'singletext',q:'Você já fez alguma outra cirurgia?',o:['Não','Sim'],ph:'Se sim, quais e em que ano, mais ou menos.'},
 {id:'4',b:1,t:'multi',excl:0,q:'Você usa ou já usou algum hormônio?',s:'Reposição hormonal (TRH) é o tratamento com estrogênio e/ou progesterona que o médico indica para os sintomas da menopausa. Pode marcar mais de uma.',o:['Nunca usei hormônio','Anticoncepcional (pílula, injeção, adesivo ou anel)','DIU hormonal','Implante hormonal (incluindo o “chip”)','Reposição hormonal da menopausa: uso atualmente','Reposição hormonal da menopausa: já usei e parei','Uso algo, mas não sei o que é']},
 {id:'4e',b:1,t:'single',q:'Quando você fez seus últimos exames de sangue?',s:'Se tiver, guarde: a equipe pode pedir para ver.',o:['Há menos de 3 meses','Entre 3 e 6 meses','Entre 6 e 12 meses','Há mais de 1 ano','Nunca fiz ou não lembro']},
 {id:'5',b:1,t:'text',q:'Em uma frase: o que mais te incomoda nesta fase da vida, neste momento?',ph:'Do seu jeito, com as suas palavras.',fb:'Obrigada por compartilhar isso.'},
 {id:'6',b:2,t:'sym',q:'Ondas de calor (fogachos)'},
 {id:'7',b:2,t:'sym',q:'Suores noturnos'},
 {id:'8',b:2,t:'sym',q:'Dificuldade para pegar no sono ou acordar durante a noite'},
 {id:'8b',b:2,t:'sym',q:'Acordar cansada, mesmo depois de dormir'},
 {id:'9',b:2,t:'sym',q:'Cansaço ou falta de energia durante o dia'},
 {id:'10',b:2,t:'sym',q:'Dor nas articulações (joelhos, mãos, quadril, ombros)'},
 {id:'10b',b:2,t:'sym',q:'Dor ou rigidez nos músculos, mesmo sem ter feito esforço'},
 {id:'11',b:2,t:'sym',q:'Ganho de peso'},
 {id:'11b',b:2,t:'sym',q:'Aumento da gordura na barriga, mesmo sem ganhar peso'},
 {id:'12',b:2,t:'sym',q:'Queda de cabelo'},
 {id:'12b',b:2,t:'sym',q:'Unhas fracas ou quebradiças'},
 {id:'13',b:2,t:'sym',q:'Ressecamento vaginal'},
 {id:'13b',b:2,t:'sym',q:'Ardência, coceira ou irritação na região íntima'},
 {id:'14',b:2,t:'sym',q:'Urgência para urinar (vontade forte e repentina)'},
 {id:'14b',b:2,t:'sym',q:'Infecção urinária de repetição',fb:'Você está se ouvindo.'},
 {id:'15',b:3,t:'single',q:'Você tem vida sexual ativa atualmente?',o:['Sim','Não, mas gostaria de ter','Não, e no momento não tenho interesse','Prefiro não responder']},
 {id:'16a',b:3,t:'single',c:A=>yes(A['15']),q:'Como está o seu desejo hoje, comparado à época em que você se sentia mais satisfeita?',o:['Igual ou maior','Um pouco menor','Muito menor','Praticamente ausente','Prefiro não responder']},

let ctx=null;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ctx.state==='suspended')ctx.resume();return ctx}
let lastTick=0;
function play(kind,val){
  if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime;
  const env=(g,a,peak,dec)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dec)};
  if(kind==='bell'||kind==='chord'){
    const base=kind==='chord'?[396,528,660]:[528];
    base.forEach((f,j)=>[1,2.76,5.4].forEach((m,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;const st=t+j*.18;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(.09/(i+1),st+.01);g.gain.exponentialRampToValueAtTime(0.0001,st+2.6/(i+1));o.connect(g).connect(c.destination);o.start(st);o.stop(st+2.8)}));
  }else if(kind==='drop'){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(1300,t);o.frequency.exponentialRampToValueAtTime(420,t+.14);env(g,.005,.16,.22);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.25)}
  else if(kind==='wood'){const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='triangle';o.frequency.value=820;f.type='bandpass';f.frequency.value=900;f.Q.value=4;env(g,.002,.35,.09);o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+.12)}
  else if(kind==='leaf'){const n=c.sampleRate*.28,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(2200,t);f.frequency.linearRampToValueAtTime(4200,t+.25);f.Q.value=1.2;env(g,.04,.12,.28);s.connect(f).connect(g).connect(c.destination);s.start(t)}
  else if(kind==='tick'){const now=performance.now();if(now-lastTick<45)return;lastTick=now;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=520+val*70;env(g,.003,.06,.07);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.08)}
  if(navigator.vibrate&&kind!=='tick'){try{navigator.vibrate(kind==='bell'?18:8)}catch(e){}}
}

function petalPath(L,w){return `M0,0 C${w},${-L*.32} ${w},${-L*.78} 0,${-L} C${-w},${-L*.78} ${-w},${-L*.32} 0,0Z`}
function progSVG(block,frac){
  let s='<svg viewBox="-20 -20 40 40" aria-hidden="true">';
  for(let i=0;i<7;i++){const o=i<block-1?1:i===block-1?.3+.7*frac:.14;const col=i<block-1?'var(--gold)':'var(--rose)';s+=`<path d="${petalPath(17,5.6)}" transform="rotate(${(i*360/7).toFixed(2)})" fill="${col}" opacity="${o.toFixed(2)}"/>`}
  return s+'<circle r="3.2" fill="var(--surface)" stroke="var(--gold)" stroke-width="1.2"/></svg>';
}
function flowerSVG(size,n,cls){let s=`<svg viewBox="-75 -75 150 150" aria-hidden="true"><g class="${cls||''}">`;const cols=['var(--rose)','var(--lav)','var(--gold)','var(--sage)'];for(let i=0;i<n;i++)s+=`<path d="${petalPath(62,22)}" transform="rotate(${i*360/n})" fill="${cols[i%4]}" opacity=".22"/>`;return s+'</g><circle r="9" fill="var(--gold)" opacity=".85"/></svg>'}

function drawMap(D){
  const svg=$('#map');const n=D.length;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rings='';[55,95,135].forEach(r=>rings+=`<circle r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="2 5"/>`);
  let petals='',labels='';
  D.forEach((d,i)=>{const ang=i*360/n;const rad=(ang-90)*Math.PI/180;
    petals+=`<path id="pt${i}" transform="rotate(${ang})" fill="${vcol(d.v)}" fill-opacity="${d.v==null?0:.82}" stroke="${d.v==null?'var(--muted)':'var(--surface)'}" stroke-width="1.5" ${d.v==null?'stroke-dasharray="3 3"':''} d="M0,0"/>`;
    const R=158,x=Math.cos(rad)*R,y=Math.sin(rad)*R;const anc=x>12?'start':x<-12?'end':'middle';
    labels+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="var(--ink)">${d.n}</text>`;
  });
  svg.innerHTML=rings+petals+'<circle r="16" fill="var(--gold)"/><circle r="16" fill="none" stroke="var(--surface)" stroke-width="3"/>'+labels;
  const target=D.map(d=>d.v==null?38:46+d.v*94);
  const t0=performance.now();
  function frame(now){let done=true;
    D.forEach((d,i)=>{const st=i*140,dur=900;let p=reduce?1:Math.min(1,Math.max(0,(now-t0-st)/dur));if(p<1)done=false;const e=1-Math.pow(1-p,3);const L=target[i]*e;$('#pt'+i).setAttribute('d',petalPath(L,(14+(d.v||0)*14)*Math.max(e,.01)))});
    if(!done)requestAnimationFrame(frame);else $('#ready').classList.add('on');}
  requestAnimationFrame(frame);
}

/* ---------- envio para a equipe (versão publicada) ---------- */
let sent=false,sending=false;
async function enviar(){
  if(sent||sending)return;sending=true;
  const st=$('#sendst'),rb=$('#retry');
  if(!A._submittedAt)A._submittedAt=new Date().toISOString();
  const R=buildReport();
  const payload={token:CONFIG.TOKEN,code:CODE,submittedAt:A._submittedAt,consentAt:A._consentAt||null,declaracaoAt:get('m19')||null,age:get('1')??null,flags:R.flagsCount,sarcF:sarcF(),parq:R.parqCount,answers:A,sections:R.sections,medico:R.medico};
  try{localStorage.setItem('mmi_pendente',JSON.stringify(payload))}catch(e){}
  if(st)st.textContent='Enviando suas respostas para a equipe…';if(rb)rb.hidden=true;
  try{
    const r=await fetch(CONFIG.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await r.json();if(!j.ok)throw new Error(j.erro||'erro');
    sent=true;if(st)st.textContent='Pronto. Suas respostas chegaram à equipe Sigma.';
    try{localStorage.removeItem('mmi_pendente')}catch(e){}
  }catch(err){
    if(st)st.textContent='Não conseguimos enviar agora. Confira a internet e toque em “Tentar enviar de novo”. Suas respostas estão guardadas neste aparelho.';
    if(rb){rb.hidden=false;rb.onclick=enviar}
  }finally{sending=false}
}
